<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Умная коптильня</title>
    
    <!-- Подключаем MQTT библиотеку -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    
    <style>
        *{box-sizing:border-box;}
        body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;margin:0;padding:10px;font-size:14px;}
        .container{max-width:1200px;margin:0 auto;background:white;padding:15px;border-radius:12px;}
        h1{color:#2c3e50;font-size:24px;}
        
        /* ===== КНОПКИ ===== */
        .btn{padding:8px 12px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;margin:4px;min-height:44px;min-width:44px;touch-action:manipulation;}
        .btn-save{background:#2196F3;color:white;}
        .btn-run{background:#4CAF50;color:white;}
        .btn-stop{background:#f44336;color:white;}
        .btn-add{background:#FF9800;color:white;}
        .btn-danger{background:#f44336;color:white;}
        .btn-small{padding:5px 10px;font-size:12px;min-height:34px;min-width:34px;}
        
        /* ===== СТАТУС ГРИД ===== */
        .status-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:10px 0;}
        .status-item{background:#f8f9fa;padding:8px 10px;border-radius:6px;border-left:4px solid #4CAF50;}
        .status-item .label{font-size:0.65em;color:#888;}
        .status-item .value{font-size:1em;font-weight:bold;}
        .status-item.heater-on{border-left-color:#ff6b6b;}
        .status-item.heater-off{border-left-color:#555;}
        
        /* ===== СТАТУС СОЕДИНЕНИЯ ===== */
        .connection-status{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#f0f0f0;border-radius:20px;font-size:12px;margin:5px 0;flex-wrap:wrap;}
        .connection-status .dot{width:10px;height:10px;border-radius:50%;display:inline-block;transition:all 0.3s;}
        .connection-status .dot.online{background:#4CAF50;animation:pulse 2s infinite;}
        .connection-status .dot.offline{background:#f44336;}
        @keyframes pulse{0%{opacity:1;transform:scale(1);}50%{opacity:0.5;transform:scale(0.8);}100%{opacity:1;transform:scale(1);}}
        .connection-status button{background:none;border:1px solid #ccc;border-radius:12px;padding:2px 8px;font-size:11px;cursor:pointer;touch-action:manipulation;min-height:28px;min-width:28px;}
        .connection-status button:hover{background:#e0e0e0;}
        
        /* ===== ТАБЛИЦА ===== */
        .table-wrapper{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px -5px;padding:0 5px;}
        .stage-table{min-width:650px;width:100%;border-collapse:collapse;font-size:11px;}
        .stage-table th{background:#2c3e50;color:white;padding:6px 3px;text-align:center;white-space:nowrap;}
        .stage-table td{border:1px solid #ddd;padding:4px 2px;text-align:center;vertical-align:middle;}
        .stage-table tr:nth-child(even){background:#f8f9fa;}
        .stage-table input[type=number]{width:45px;padding:2px;border:1px solid #ddd;border-radius:3px;font-size:10px;text-align:center;}
        .stage-table input[type=text]{width:60px;padding:2px;border:1px solid #ddd;border-radius:3px;font-size:10px;text-align:center;}
        .stage-table select{padding:2px;border:1px solid #ddd;border-radius:3px;font-size:9px;}
        .stage-table input[type=checkbox]{width:14px;height:14px;cursor:pointer;}
        
        /* ===== СТАТУСЫ ЭТАПОВ ===== */
        .stage-active{background:#e8f5e9;}
        .stage-inactive{opacity:0.4;}
        .stage-number{font-weight:bold;padding:2px 6px;border-radius:50%;display:inline-block;font-size:11px;}
        .stage-number.active{background:#4CAF50;color:white;}
        .stage-number.done{background:#2196F3;color:white;}
        .stage-number.error{background:#f44336;color:white;}
        .stage-number.waiting{background:#999;color:white;}
        
        /* ===== ДЫМОГЕНЕРАТОР ===== */
        .smoke-panel{background:#263238;color:white;padding:12px;border-radius:8px;margin:10px 0;}
        .smoke-panel h3{color:#ffd93d;margin:0 0 8px 0;font-size:16px;}
        .smoke-status{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
        .smoke-status .item{padding:6px;border-radius:4px;text-align:center;background:#1a1a2e;}
        .smoke-status .item .state{font-size:1.2em;}
        .smoke-status .item .label{font-size:0.65em;color:#aaa;}
        .smoke-on{background:#2e7d32;}
        .smoke-off{background:#555;}
        .smoke-error{background:#c62828;}
        .smoke-wait{background:#f57c00;}
        
        /* ===== СТАТУС БАР ===== */
        .stage-status-bar{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0;align-items:center;}
        .stage-status-bar .dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 3px rgba(0,0,0,0.3);}
        .stage-status-bar .dot.active{background:#4CAF50;}
        .stage-status-bar .dot.done{background:#2196F3;}
        .stage-status-bar .dot.error{background:#f44336;}
        .stage-status-bar .dot.waiting{background:#999;}
        .stage-status-bar .label{font-size:10px;color:#666;font-weight:bold;}
        
        /* ===== ЛОГ ===== */
        .log-panel{background:#1a1a2e;color:#00ff88;padding:8px;border-radius:8px;max-height:120px;overflow-y:auto;font-size:11px;font-family:'Courier New',monospace;margin:10px 0;}
        .log-panel .log-entry{padding:2px 0;border-bottom:1px solid #333;}
        .log-panel .log-error{color:#ff6b6b;}
        .log-panel .log-success{color:#69db7c;}
        .log-panel .log-warn{color:#ffd93d;}
        
        .flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
        .mt-10{margin-top:10px;}
        
        /* ===== TOAST ===== */
        .toast{position:fixed;bottom:20px;right:20px;padding:12px 20px;border-radius:8px;color:white;z-index:999;display:none;font-weight:600;font-size:13px;max-width:90%;}
        .toast-success{background:#4CAF50;}
        .toast-error{background:#f44336;}
        .toast-warning{background:#FF9800;}
        
        /* ===== АДАПТИВ ===== */
        @media(max-width:768px){
            body{padding:5px;font-size:12px;}
            .container{padding:8px;}
            h1{font-size:18px;}
            .status-grid{grid-template-columns:repeat(3,1fr);gap:4px;}
            .status-item{padding:4px 6px;}
            .status-item .value{font-size:13px;}
            .status-item .label{font-size:9px;}
            .stage-table{min-width:550px;font-size:10px;}
            .stage-table th,.stage-table td{padding:3px 2px;}
            .stage-table input[type=number]{width:35px;font-size:9px;padding:1px;}
            .stage-table input[type=text]{width:45px;font-size:9px;padding:1px;}
            .stage-table select{font-size:8px;padding:1px;max-width:45px;}
            .btn{padding:5px 8px;font-size:10px;min-height:34px;min-width:34px;margin:2px;}
            .btn-small{font-size:9px;padding:3px 6px;min-height:28px;min-width:28px;}
            .smoke-status{grid-template-columns:repeat(2,1fr);gap:4px;}
            .smoke-status .item .state{font-size:1em;}
            .log-panel{max-height:80px;font-size:10px;}
            .toast{font-size:11px;padding:8px 14px;bottom:10px;right:10px;left:10px;}
            .connection-status{font-size:10px;padding:4px 8px;}
        }
        @media(max-width:480px){
            .status-grid{grid-template-columns:repeat(2,1fr);gap:3px;}
            .stage-table{min-width:450px;font-size:9px;}
            .stage-table input[type=number]{width:28px;font-size:8px;}
            .stage-table input[type=text]{width:35px;font-size:8px;}
            .stage-table select{font-size:7px;max-width:35px;}
            .btn{font-size:9px;padding:4px 6px;min-height:30px;min-width:30px;}
            .container{padding:4px;}
            .smoke-panel h3{font-size:13px;}
            .smoke-status .item .state{font-size:0.9em;}
            .stage-number{font-size:9px;padding:1px 4px;}
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔥 Умная коптильня</h1>
    <div id="toast" class="toast"></div>

    <!-- ===== СТАТУС СОЕДИНЕНИЯ ===== -->
    <div class="connection-status">
        <span class="dot" id="connectionDot"></span>
        <span id="connectionText">Подключение...</span>
        <span id="connectionType">📶</span>
        <button onclick="reconnectMQTT()">🔄</button>
    </div>

    <!-- ===== СТАТУС ===== -->
    <div class="status-grid">
        <div class="status-item"><div class="label">Статус</div><div class="value" id="statusText">Ожидание</div></div>
        <div class="status-item"><div class="label">Этап</div><div class="value" id="stageText">--</div></div>
        <div class="status-item"><div class="label">Осталось</div><div class="value" id="timeLeft">--</div></div>
        <div class="status-item" style="border-left-color:#ff6b6b;"><div class="label">Камера</div><div class="value" id="t_cam">0.0°C</div></div>
        <div class="status-item" style="border-left-color:#4ecdc4;"><div class="label">Батон</div><div class="value" id="t_bat">0.0°C</div></div>
        <div class="status-item" style="border-left-color:#ffd93d;"><div class="label">Дым</div><div class="value" id="t_smk">0.0°C</div></div>
        <div class="status-item" id="heaterStatus"><div class="label">ТЭН</div><div class="value" id="t_heater">⏸ Выкл</div></div>
    </div>

    <!-- ===== ДЫМОГЕНЕРАТОР ===== -->
    <div class="smoke-panel">
        <h3>💨 Дымогенератор</h3>
        <div class="smoke-status">
            <div class="item"><div class="label">Заслонка</div><div class="state" id="smokeSolenoid">🔒</div></div>
            <div class="item"><div class="label">Вентилятор</div><div class="state" id="smokeFan">⏸</div></div>
            <div class="item"><div class="label">Свеча</div><div class="state" id="smokeGlow">⏸</div></div>
            <div class="item"><div class="label">Статус</div><div class="state" id="smokeState">Ожидание</div></div>
        </div>
    </div>

    <!-- ===== КНОПКИ ===== -->
    <div>
        <button class="btn btn-save" onclick="saveSettings()">💾 Сохранить</button>
        <button class="btn btn-run" onclick="runRecipe()" id="runBtn">▶ Запустить</button>
        <button class="btn btn-stop" onclick="stopRecipe()" id="stopBtn" style="display:none">⏹ Стоп</button>
        <button class="btn btn-add" onclick="addRecipe()">➕ Новый</button>
        <button class="btn btn-danger" onclick="deleteRecipe()">🗑 Удалить</button>
        <button class="btn btn-add btn-small" onclick="toggleSound()" id="soundBtn">🔊 Звук Вкл</button>
    </div>

    <!-- ===== РЕЦЕПТ ===== -->
    <div class="flex">
        <label>Рецепт: <select id="recipeSelect" onchange="loadRecipe()"></select></label>
        <label>Название: <input type="text" id="recipeName"></label>
        <label>Макс.темп: <input type="number" id="maxTemp" step="0.5" style="width:55px;"></label>
        <label>Дельта: <input type="number" id="delta" step="0.5" style="width:55px;"></label>
    </div>

    <!-- ===== СТАТУС-БАР ЭТАПОВ ===== -->
    <div class="stage-status-bar" id="stageStatusBar"><span class="label">Статус этапов:</span></div>

    <!-- ===== ТАБЛИЦА ===== -->
    <div class="table-wrapper">
        <table class="stage-table">
            <thead>
                <tr>
                    <th>#</th><th>Название</th><th>Актив</th><th>Tкам</th><th>Tбат</th>
                    <th>Время(ч)</th><th>Дым</th><th>Вода</th><th>Реж.охл</th>
                    <th>Tохл</th><th>Таймаут</th><th>Удерж</th><th>Мин</th><th></th>
                </tr>
            </thead>
            <tbody id="stageBody"></tbody>
        </table>
    </div>

    <div class="flex mt-10">
        <button class="btn btn-add btn-small" onclick="addStage()">➕ Добавить этап</button>
        <span style="color:#888;font-size:11px;">(всего 5 этапов)</span>
    </div>

    <!-- ===== ЛОГ ===== -->
    <div class="log-panel" id="logPanel">
        <div style="color:#888;font-size:10px;">📋 Журнал событий</div>
        <div id="logContent"></div>
    </div>
</div>

<script>
// ==================== ПАРОЛЬ (ЗАЩИТА) ====================
const ACCESS_PASSWORD = "kopty2026";

function checkPassword() {
    const savedPassword = localStorage.getItem('smoker_password');
    if (savedPassword === ACCESS_PASSWORD) {
        return true;
    }
    
    const entered = prompt('🔐 Введите пароль для доступа к коптильне:');
    if (entered === ACCESS_PASSWORD) {
        localStorage.setItem('smoker_password', entered);
        return true;
    } else {
        document.body.innerHTML = `
            <div style="text-align:center;margin-top:50px;padding:20px;">
                <h1 style="color:red;">🔒 ДОСТУП ЗАПРЕЩЁН</h1>
                <p style="color:#666;">Неверный пароль</p>
                <button onclick="location.reload()" style="padding:10px 20px;margin-top:20px;border-radius:8px;border:none;background:#2196F3;color:white;font-size:16px;cursor:pointer;">
                    Попробовать снова
                </button>
            </div>
        `;
        return false;
    }
}

if (!checkPassword()) {
    throw new Error('Access denied');
}

// ==================== MQTT НАСТРОЙКИ ====================
// ИСПОЛЬЗУЕМ ЗАЩИЩЁННЫЙ WEBSOCKET ДЛЯ HTTPS
const MQTT_BROKER = 'wss://broker.hivemq.com:8884/mqtt';
const MQTT_TOPIC_STATUS = 'smoker/status';
const MQTT_TOPIC_COMMAND = 'smoker/command';

let mqttClient = null;
let currentIdx = 0;
let recipes = [];
let stageStatus = [];
let audioCtx = null;
let soundEnabled = true;
let lastStatus = {};

// ==================== ПОДКЛЮЧЕНИЕ К MQTT ====================
function connectMQTT() {
    try {
        const options = {
            reconnectPeriod: 5000,
            connectTimeout: 30000,
            keepalive: 60,
            clean: true,
        };
        
        mqttClient = mqtt.connect(MQTT_BROKER, options);
        
        mqttClient.on('connect', function() {
            console.log('✅ MQTT подключено к ' + MQTT_BROKER);
            updateConnectionStatus(true, 'MQTT');
            mqttClient.subscribe(MQTT_TOPIC_STATUS);
            mqttClient.publish(MQTT_TOPIC_COMMAND, 'status');
            showToast('✅ MQTT подключён!', 'success');
            loadRecipe();
        });
        
        mqttClient.on('message', function(topic, message) {
            if (topic === MQTT_TOPIC_STATUS) {
                try {
                    const data = JSON.parse(message.toString());
                    updateUI(data);
                } catch(e) {
                    console.log('❌ Ошибка парсинга JSON:', e);
                }
            }
        });
        
        mqttClient.on('error', function(err) {
            console.log('❌ MQTT ошибка:', err);
            updateConnectionStatus(false);
        });
        
        mqttClient.on('close', function() {
            console.log('⚠️ MQTT отключено');
            updateConnectionStatus(false);
            setTimeout(connectMQTT, 5000);
        });
        
    } catch(e) {
        console.log('❌ Ошибка подключения MQTT:', e);
        updateConnectionStatus(false);
        setTimeout(connectMQTT, 5000);
    }
}

function reconnectMQTT() {
    if (mqttClient) {
        try {
            mqttClient.end();
        } catch(e) {}
        mqttClient = null;
    }
    connectMQTT();
    showToast('🔄 Переподключение...', 'warning');
}

function sendCommand(command) {
    if (mqttClient && mqttClient.connected) {
        mqttClient.publish(MQTT_TOPIC_COMMAND, command);
        showToast('✅ Команда отправлена: ' + command, 'success');
    } else {
        showToast('❌ Нет соединения с MQTT', 'error');
        reconnectMQTT();
    }
}

// ==================== UI ОБНОВЛЕНИЕ ====================
function updateConnectionStatus(isOnline, type) {
    const dot = document.getElementById('connectionDot');
    const text = document.getElementById('connectionText');
    const typeEl = document.getElementById('connectionType');
    
    if (isOnline) {
        dot.className = 'dot online';
        text.textContent = 'MQTT Онлайн';
        text.style.color = '#4CAF50';
        typeEl.textContent = '☁️ Облако';
    } else {
        dot.className = 'dot offline';
        text.textContent = 'MQTT Офлайн';
        text.style.color = '#f44336';
        typeEl.textContent = '❌';
    }
}

// ==================== ЗВУК ====================
function initAudio() {
    if (!audioCtx) {
        try { audioCtx = new(window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
}

function playBeep(freq, dur, vol) {
    if (!soundEnabled) return;
    try {
        initAudio();
        if (!audioCtx) return;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        osc.type = 'square';
        gain.gain.value = vol || 0.3;
        osc.start();
        setTimeout(function() { osc.stop(); }, dur);
    } catch(e) {}
}

function playSuccess() {
    playBeep(2000, 150);
    setTimeout(function() { playBeep(2000, 150); }, 250);
    setTimeout(function() { playBeep(2000, 150); }, 500);
}

function playError() {
    for (var i = 0; i < 5; i++) {
        setTimeout(function(i) { return function() { playBeep(1000, 400); }; }(i), i * 600);
    }
}

function playWarning() {
    playBeep(1500, 150);
    setTimeout(function() { playBeep(1500, 150); }, 300);
}

function playStageComplete() { playBeep(2000, 400); }
function playRecipeComplete() {
    playBeep(523, 200);
    setTimeout(function() { playBeep(659, 200); }, 250);
    setTimeout(function() { playBeep(784, 200); }, 500);
    setTimeout(function() { playBeep(1047, 400); }, 750);
}
function playEmergencyStop() {
    for (var i = 0; i < 10; i++) {
        setTimeout(function(i) { return function() { playBeep(800, 100); }; }(i), i * 200);
    }
}

function toggleSound() {
    soundEnabled = !soundEnabled;
    document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 Звук Вкл' : '🔇 Звук Выкл';
}

// ==================== УВЕДОМЛЕНИЯ ====================
function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + (type === 'success' ? 'toast-success' : type === 'error' ? 'toast-error' : 'toast-warning');
    t.style.display = 'block';
    setTimeout(function() { t.style.display = 'none'; }, 4000);
}

// ==================== UI ====================
function updateUI(data) {
    if (!data) return;
    document.getElementById('statusText').innerText = data.status || 'Ожидание';
    document.getElementById('stageText').innerText = data.stage || '--';
    document.getElementById('t_cam').innerText = (data.cam || 0).toFixed(1) + '°C';
    document.getElementById('t_bat').innerText = (data.bat || 0).toFixed(1) + '°C';
    document.getElementById('t_smk').innerText = (data.smk || 0).toFixed(1) + '°C';
    
    var heaterEl = document.getElementById('t_heater');
    var heaterStatus = document.getElementById('heaterStatus');
    if (data.heater) {
        heaterEl.innerHTML = '🔥 Вкл';
        heaterStatus.className = 'status-item heater-on';
    } else {
        heaterEl.innerHTML = '⏸ Выкл';
        heaterStatus.className = 'status-item heater-off';
    }
    
    if (data.timeLeft >= 0) {
        var h = Math.floor(data.timeLeft / 3600);
        var m = Math.floor((data.timeLeft % 3600) / 60);
        document.getElementById('timeLeft').innerText = h + 'ч ' + m + 'м';
    } else {
        document.getElementById('timeLeft').innerText = '--';
    }
    
    if (data.status === 'Работает') {
        document.getElementById('runBtn').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'inline-block';
    } else {
        document.getElementById('runBtn').style.display = 'inline-block';
        document.getElementById('stopBtn').style.display = 'none';
    }
    
    if (data.stageStatus) { 
        stageStatus = data.stageStatus; 
        updateStageColors(); 
    }
    
    if (data.smoke) {
        document.getElementById('smokeSolenoid').innerHTML = data.smoke.solenoid ? '🔓 Открыта' : '🔒 Закрыта';
        document.getElementById('smokeSolenoid').className = 'state ' + (data.smoke.solenoid ? 'smoke-on' : 'smoke-off');
        document.getElementById('smokeFan').innerHTML = data.smoke.fan ? '🌀 Вкл' : '⏸ Выкл';
        document.getElementById('smokeFan').className = 'state ' + (data.smoke.fan ? 'smoke-on' : 'smoke-off');
        document.getElementById('smokeGlow').innerHTML = data.smoke.glow ? '🔥 Вкл' : '⏸ Выкл';
        document.getElementById('smokeGlow').className = 'state ' + (data.smoke.glow ? 'smoke-on' : 'smoke-off');
        document.getElementById('smokeState').innerHTML = data.smoke.stateText || 'Ожидание';
        var cls = 'smoke-off';
        if (data.smoke.stateText === 'Ошибка') cls = 'smoke-error';
        else if (data.smoke.stateText === 'Работает') cls = 'smoke-on';
        else if (data.smoke.stateText && (data.smoke.stateText.includes('Розжиг') || data.smoke.stateText.includes('Пауза'))) cls = 'smoke-wait';
        document.getElementById('smokeState').className = 'state ' + cls;
    }
    
    if (data.hasError && !lastStatus._errorPlayed) {
        lastStatus._errorPlayed = true;
        playEmergencyStop();
        showToast('⚠️ АВАРИЯ!', 'error');
    }
    if (data.status === 'Завершён' && !lastStatus._completePlayed) {
        lastStatus._completePlayed = true;
        playRecipeComplete();
        showToast('🏁 Рецепт завершён!', 'success');
    }
    if (data.stage !== lastStatus._lastStage && data.status === 'Работает') {
        lastStatus._lastStage = data.stage;
        playStageComplete();
    }
    if (data.smoke && data.smoke.stateText === 'Ошибка' && data.smoke.stateText !== lastStatus._smokeState) {
        lastStatus._smokeState = data.smoke.stateText;
        playError();
        showToast('❌ Ошибка дымогенератора!', 'error');
    }
    if (data.smoke && data.smoke.stateText === 'Работает' && data.smoke.stateText !== lastStatus._smokeState) {
        lastStatus._smokeState = data.smoke.stateText;
        playSuccess();
        showToast('✅ Дымогенератор запущен!', 'success');
    }
    if (data.smoke && data.smoke.stateText === 'Пауза 3 мин' && data.smoke.stateText !== lastStatus._smokeState) {
        lastStatus._smokeState = data.smoke.stateText;
        playWarning();
        showToast('⚠️ Повтор розжига через 3 минуты', 'warning');
    }
    
    if (data.log) {
        var logDiv = document.getElementById('logContent');
        var lines = data.log.split('\n');
        var html = '';
        for (var i = 0; i < lines.length; i++) {
            if (lines[i].trim()) {
                var cls = '';
                if (lines[i].includes('❌') || lines[i].includes('ОШИБКА') || lines[i].includes('АВАРИЙНАЯ')) cls = 'log-error';
                else if (lines[i].includes('✅')) cls = 'log-success';
                else if (lines[i].includes('⚠️')) cls = 'log-warn';
                html += '<div class="log-entry ' + cls + '">' + lines[i] + '</div>';
            }
        }
        logDiv.innerHTML = html;
        var panel = document.getElementById('logPanel');
        if (panel) panel.scrollTop = panel.scrollHeight;
    }
}

// ==================== ЦВЕТА ЭТАПОВ ====================
function updateStageColors() {
    var rows = document.querySelectorAll('#stageBody tr');
    var statusBar = document.getElementById('stageStatusBar');
    if (!statusBar) return;
    statusBar.innerHTML = '<span class="label">Статус этапов:</span>';
    rows.forEach(function(row, i) {
        var num = row.querySelector('.stage-number');
        if (!num) {
            var firstTd = row.querySelector('td');
            if (firstTd) {
                var newNum = document.createElement('span');
                newNum.className = 'stage-number';
                newNum.textContent = (i + 1);
                firstTd.innerHTML = '';
                firstTd.appendChild(newNum);
                num = newNum;
            }
        }
        var status = stageStatus[i] || 'waiting';
        if (num) {
            num.className = 'stage-number ' + status;
        }
        row.className = 'stage-' + status;
        
        var dot = document.createElement('span');
        dot.className = 'dot ' + status;
        dot.title = (i + 1) + '. ' + status;
        statusBar.appendChild(dot);
    });
}

// ==================== РЕЦЕПТЫ ====================
function loadRecipesList() {
    var sel = document.getElementById('recipeSelect');
    if (!sel) return;
    sel.innerHTML = '';
    for (var i = 0; i < 10; i++) {
        var opt = document.createElement('option');
        opt.value = i;
        opt.textContent = (i + 1) + '. ' + (recipes[i] ? recipes[i].name : 'Рецепт ' + (i + 1));
        sel.appendChild(opt);
    }
}

function loadRecipe() {
    var idx = parseInt(document.getElementById('recipeSelect').value);
    currentIdx = idx;
    
    if (recipes && recipes.length > 0 && recipes[idx]) {
        var recipe = recipes[idx];
        document.getElementById('recipeName').value = recipe.name || 'Рецепт ' + (idx + 1);
        document.getElementById('maxTemp').value = recipe.maxCameraTemp || 80;
        document.getElementById('delta').value = recipe.deltaCelsius || 18;
        renderStages(recipe.stages || []);
        loadRecipesList();
        document.getElementById('recipeSelect').value = idx;
        return;
    }
    
    var emptyRecipe = {
        name: 'Новый рецепт ' + (idx + 1),
        maxCameraTemp: 80,
        deltaCelsius: 18,
        stages: []
    };
    for (var i = 0; i < 5; i++) {
        emptyRecipe.stages.push({
            active: false,
            name: 'Этап ' + (i + 1),
            targetCameraTemp: 0,
            targetBatonTemp: 0,
            durationHours: 0,
            smokeOn: false,
            waterOn: false,
            coolMode: 0,
            coolTargetTemp: 0,
            coolTimeoutMin: 0,
            requireHold: false,
            holdMinutes: 0
        });
    }
    recipes[idx] = emptyRecipe;
    document.getElementById('recipeName').value = emptyRecipe.name;
    document.getElementById('maxTemp').value = emptyRecipe.maxCameraTemp;
    document.getElementById('delta').value = emptyRecipe.deltaCelsius;
    renderStages(emptyRecipe.stages);
    loadRecipesList();
    document.getElementById('recipeSelect').value = idx;
}

function renderStages(stages) {
    var tbody = document.getElementById('stageBody');
    if (!tbody) return;
    tbody.innerHTML = '';
    stages.forEach(function(s, i) {
        var tr = document.createElement('tr');
        tr.className = s.active ? 'stage-active' : 'stage-inactive';
        tr.innerHTML = '<td><span class="stage-number">' + (i + 1) + '</span></td>' +
            '<td><input type="text" class="stage-name" value="' + (s.name || 'Этап ' + (i + 1)) + '" data-idx="' + i + '"></td>' +
            '<td><input type="checkbox" class="stage-active-chk" ' + (s.active ? 'checked' : '') + ' data-idx="' + i + '"></td>' +
            '<td><input type="number" class="stage-cam" step="0.1" value="' + (s.targetCameraTemp || 0) + '" data-idx="' + i + '"></td>' +
            '<td><input type="number" class="stage-bat" step="0.1" value="' + (s.targetBatonTemp || 0) + '" data-idx="' + i + '"></td>' +
            '<td><input type="number" class="stage-dur" step="0.1" value="' + (s.durationHours || 0) + '" data-idx="' + i + '"></td>' +
            '<td><select class="stage-smoke" data-idx="' + i + '"><option value="1" ' + (s.smokeOn ? 'selected' : '') + '>ДА</option><option value="0" ' + (!s.smokeOn ? 'selected' : '') + '>НЕТ</option></select></td>' +
            '<td><select class="stage-water" data-idx="' + i + '"><option value="1" ' + (s.waterOn ? 'selected' : '') + '>ДА</option><option value="0" ' + (!s.waterOn ? 'selected' : '') + '>НЕТ</option></select></td>' +
            '<td><select class="stage-cool" data-idx="' + i + '"><option value="0" ' + (s.coolMode == 0 ? 'selected' : '') + '>Нет</option><option value="1" ' + (s.coolMode == 1 ? 'selected' : '') + '>Непрер</option><option value="2" ' + (s.coolMode == 2 ? 'selected' : '') + '>Импульс</option><option value="3" ' + (s.coolMode == 3 ? 'selected' : '') + '>Имп+тайм</option></select></td>' +
            '<td><input type="number" class="stage-cooltarget" step="0.1" value="' + (s.coolTargetTemp || 0) + '" data-idx="' + i + '"></td>' +
            '<td><input type="number" class="stage-cooltimeout" value="' + (s.coolTimeoutMin || 0) + '" data-idx="' + i + '"></td>' +
            '<td><select class="stage-hold" data-idx="' + i + '"><option value="1" ' + (s.requireHold ? 'selected' : '') + '>ДА</option><option value="0" ' + (!s.requireHold ? 'selected' : '') + '>НЕТ</option></select></td>' +
            '<td><input type="number" class="stage-holdmin" step="0.5" value="' + (s.holdMinutes || 0) + '" data-idx="' + i + '"></td>' +
            '<td><button onclick="removeStage(' + i + ')" ' + (i < 2 ? 'disabled' : '') + '>✕</button></td>';
        tbody.appendChild(tr);
    });
}

function getStagesFromUI() {
    var stages = [];
    var rows = document.querySelectorAll('#stageBody tr');
    rows.forEach(function(row) {
        var idx = parseInt(row.querySelector('.stage-name').dataset.idx);
        stages[idx] = {
            active: row.querySelector('.stage-active-chk').checked,
            name: row.querySelector('.stage-name').value || 'Этап ' + (idx + 1),
            targetCameraTemp: parseFloat(row.querySelector('.stage-cam').value) || 0,
            targetBatonTemp: parseFloat(row.querySelector('.stage-bat').value) || 0,
            durationHours: parseFloat(row.querySelector('.stage-dur').value) || 0,
            smokeOn: parseInt(row.querySelector('.stage-smoke').value) === 1,
            waterOn: parseInt(row.querySelector('.stage-water').value) === 1,
            coolMode: parseInt(row.querySelector('.stage-cool').value),
            coolTargetTemp: parseFloat(row.querySelector('.stage-cooltarget').value) || 0,
            coolTimeoutMin: parseInt(row.querySelector('.stage-cooltimeout').value) || 0,
            requireHold: parseInt(row.querySelector('.stage-hold').value) === 1,
            holdMinutes: parseFloat(row.querySelector('.stage-holdmin').value) || 0
        };
    });
    return stages;
}

function saveSettings() {
    var data = {
        idx: currentIdx,
        name: document.getElementById('recipeName').value || 'Рецепт ' + (currentIdx + 1),
        maxCameraTemp: parseFloat(document.getElementById('maxTemp').value) || 80,
        deltaCelsius: parseFloat(document.getElementById('delta').value) || 18,
        stages: getStagesFromUI()
    };
    var jsonData = JSON.stringify(data);
    
    if (mqttClient && mqttClient.connected) {
        mqttClient.publish(MQTT_TOPIC_COMMAND, 'save:' + jsonData);
        showToast('✅ Сохранение через MQTT...', 'success');
        recipes[currentIdx] = data;
        loadRecipesList();
        document.getElementById('recipeSelect').value = currentIdx;
    } else {
        showToast('❌ Нет подключения к MQTT!', 'error');
        reconnectMQTT();
    }
}

function addStage() {
    var stages = getStagesFromUI();
    for (var i = 0; i < stages.length; i++) {
        if (!stages[i] || !stages[i].active) {
            if (!stages[i]) {
                stages[i] = { active: true, name: 'Новый этап ' + (i + 1), targetCameraTemp: 0, targetBatonTemp: 0, durationHours: 0, smokeOn: false, waterOn: false, coolMode: 0, coolTargetTemp: 0, coolTimeoutMin: 0, requireHold: false, holdMinutes: 0 };
            } else {
                stages[i].active = true;
                stages[i].name = 'Новый этап ' + (i + 1);
            }
            renderStages(stages);
            showToast('✅ Этап добавлен', 'success');
            return;
        }
    }
    showToast('❌ Все 5 этапов активны!', 'error');
}

function removeStage(idx) {
    var stages = getStagesFromUI();
    var activeCount = 0;
    for (var i = 0; i < stages.length; i++) {
        if (stages[i] && stages[i].active) activeCount++;
    }
    if (activeCount <= 1) {
        showToast('❌ Должен быть хотя бы 1 активный этап!', 'error');
        return;
    }
    stages[idx].active = false;
    renderStages(stages);
    showToast('✅ Этап удалён', 'success');
}

function addRecipe() {
    for (var i = 0; i < 10; i++) {
        if (!recipes[i] || recipes[i].name === 'Новый рецепт ' + (i + 1)) {
            currentIdx = i;
            document.getElementById('recipeSelect').value = i;
            loadRecipe();
            showToast('✅ Новый рецепт создан', 'success');
            return;
        }
    }
    showToast('❌ Все 10 рецептов заняты!', 'error');
}

function deleteRecipe() {
    if (!confirm('Удалить рецепт?')) return;
    var data = {
        idx: currentIdx,
        name: 'Новый рецепт ' + (currentIdx + 1),
        maxCameraTemp: 80,
        deltaCelsius: 18,
        stages: []
    };
    for (var i = 0; i < 5; i++) {
        data.stages.push({ active: false, name: 'Этап ' + (i + 1), targetCameraTemp: 0, targetBatonTemp: 0, durationHours: 0, smokeOn: false, waterOn: false, coolMode: 0, coolTargetTemp: 0, coolTimeoutMin: 0, requireHold: false, holdMinutes: 0 });
    }
    
    if (mqttClient && mqttClient.connected) {
        mqttClient.publish(MQTT_TOPIC_COMMAND, 'delete:' + JSON.stringify(data));
        showToast('✅ Удаление через MQTT...', 'success');
        recipes[currentIdx] = data;
        loadRecipe();
        loadRecipesList();
    } else {
        showToast('❌ Нет подключения к MQTT!', 'error');
        reconnectMQTT();
    }
}

function runRecipe() {
    sendCommand('start');
}

function stopRecipe() {
    sendCommand('stop');
}

// ==================== ЗАПУСК ====================
connectMQTT();
loadRecipesList();
setTimeout(function() { loadRecipe(); }, 1000);

setInterval(function() {
    if (mqttClient && mqttClient.connected) {
        mqttClient.publish(MQTT_TOPIC_COMMAND, 'status');
    }
}, 5000);
</script>
