<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Коптильня: промышленный интерфейс</title>
  <style>
    :root {
      --bg: #111318;
      --panel: #1a1d24;
      --border: #2a2e38;
      --accent: #00a8cc;       /* промышленный голубой */
      --danger: #ff5252;
      --success: #4ade80;
      --text: #e2e8f0;
      --label: #94a3b8;
    }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    h1 { margin: 0 0 4px 0; font-size: 1.4rem; color: #fff; }
    .subtitle { font-size: 0.85rem; color: var(--label); margin-bottom: 20px; }

    .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 960px; margin: 0 auto; }
    @media (max-width: 600px) { .dashboard { grid-template-columns: 1fr; } }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin-bottom: 6px; }
    .temp-value { font-weight: 700; font-size: 2.2rem; color: #fff; line-height: 1; }
    
    .progress-container { margin-top: 10px; height: 8px; background: #2a2e38; border-radius: 4px; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }

    .status-box {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      display: inline-block;
      text-transform: uppercase;
    }
    .status-running { background: rgba(0, 168, 204, 0.15); color: var(--accent); border: 1px solid rgba(0,168,204,0.3); }
    .status-idle { background: rgba(42, 46, 56, 0.6); color: var(--label); border: 1px solid var(--border); }

    .controls-grid { display: grid; gap: 10px; }
    button {
      padding: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      transition: transform 0.05s, box-shadow 0.2s;
    }
    button:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-recipe { background: #333; color: var(--text); }

    #recipe-list { max-height: 220px; overflow-y: auto; }
    .recipe-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 8px; border-bottom: 1px solid #2a2e38;
    }
    .recipe-name { font-weight: 500; }
    .recipe-active { color: var(--success); }

    #log {
      max-height: 180px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 10px;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }
    .log-entry.error { color: var(--danger); }
    .log-entry.info { color: var(--success); }

    #lastUpdate { margin-top: 16px; font-size: 0.75rem; color: var(--label); }
  </style>
</head>
<body>
  <h1>🥓 Коптильня: панель оператора</h1>
  <p class="subtitle">Промышленный интерфейс, рецепты, мониторинг 10 км</p>

  <div class="dashboard">
    <div class="card">
      <span class="label">Температура камеры</span>
      <div class="temp-value" id="tempCam">--</div>
      <div class="progress-container"><div class="progress-bar" id="barCam"></div></div>
    </div>

    <div class="card">
      <span class="label">Температура продукта</span>
      <div class="temp-value" id="tempBat">--</div>
      <div class="progress-container"><div class="progress-bar" id="barBat"></div></div>
    </div>
  </div>

  <div class="card" style="margin-top:16px;">
    <span class="label">Статус системы</span>
    <div id="statusBox" class="status-box status-idle">ОЖИДАНИЕ</div>
    <p id="stageInfo" style="font-size:0.85rem; margin:8px 0 12px 0; color:#94a3b8;">Этап: —</p>
  </div>

  <div class="card" style="margin-top:16px;">
    <span class="label">Управление и рецепты</span>
    <div class="controls-grid">
      <button class="btn-primary" onclick="sendCommand('START')">СТАРТ</button>
      <button class="btn-danger" onclick="sendCommand('STOP')">СТОП</button>
    </div>

    <p style="margin:10px 0 6px 0; font-weight:600;">Рецепты</p>
    <div id="recipe-list">
      <!-- сюда JS добавит рецепты -->
    </div>

    <p style="margin:12px 0 4px 0; font-weight:600;">Добавить рецепт</p>
    <input type="text" id="newRecipeName" placeholder="Название рецепта" style="width:100%; padding:8px; margin-bottom:6px; background:#2a2e38; color:#fff; border:1px solid #333; border-radius:4px;">
    <input type="number" id="targetCam" placeholder="Цель камеры (°C)" style="width:100%; padding:8px; margin-bottom:6px; background:#2a2e38; color:#fff; border:1px solid #333; border-radius:4px;">
    <input type="number" id="targetBat" placeholder="Цель продукта (°C)" style="width:100%; padding:8px; margin-bottom:8px; background:#2a2e38; color:#fff; border:1px solid #333; border-radius:4px;">
    <button class="btn-recipe" onclick="addRecipe()">Добавить</button>
  </div>

  <div class="card" style="margin-top:16px;">
    <span class="label">Журнал событий</span>
    <div id="log"></div>
  </div>

  <p id="lastUpdate">Ожидание данных…</p>

    <script>
    // --- НАСТРОЙКИ ДЛЯ ТЕСТА (можно менять) ---
    const SIMULATED_TARGET_CAM = 75; // Цель камеры по умолчанию
    const SIMULATED_TARGET_BAT = 55; // Цель продукта по умолчанию

    // --- ИМИТАЦИЯ ДАННЫХ (вместо fetch с сервера) ---
    function getSimulatedData() {
      // Генерируем "реальные" колебания температуры
      const noiseCam = (Math.random() - 0.5) * 4; // шум +/- 2 градуса
      const noiseBat = (Math.random() - 0.5) * 3; // шум +/- 1.5 градуса
      
      // Имитируем нагрев: температура медленно растет к цели
      // В реальном проекте эти значения придут от ESP32
      const currentCam = Math.min(SIMULATED_TARGET_CAM + noiseCam, SIMULATED_TARGET_CAM + 5);
      const currentBat = Math.min(SIMULATED_TARGET_BAT + noiseBat, SIMULATED_TARGET_BAT + 10);

      return {
        temp_cam: parseFloat(currentCam.toFixed(1)),
        temp_bat: parseFloat(currentBat.toFixed(1)),
        status: 'running', // Статус "работает"
        stage_name: 'Копчение (нагрев)',
        target_cam: SIMULATED_TARGET_CAM,
        target_bat: SIMULATED_TARGET_BAT
      };
    }

    // --- ЛОГИРОВАНИЕ (Журнал событий) ---
    function log(msg, type = 'info') {
      const d = new Date().toLocaleTimeString();
      const div = document.createElement('div');
      div.className = 'log-entry ' + type;
      div.innerText = `[${d}] ${msg}`;
      const log = document.getElementById('log');
      log.prepend(div);
      if (log.children.length > 20) log.lastElementChild.remove();
    }

    // --- ОБНОВЛЕНИЕ ИНТЕРФЕЙСА ---
    function updateUI(data) {
      document.getElementById('tempCam').innerText = data.temp_cam;
      document.getElementById('tempBat').innerText = data.temp_bat;

      // Расчет прогресс-баров относительно цели
      const pctCam = Math.min(100, Math.max(0, (data.temp_cam / data.target_cam) * 100));
      const pctBat = Math.min(100, Math.max(0, (data.temp_bat / data.target_bat) * 100));

      document.getElementById('barCam').style.width = pctCam + '%';
      document.getElementById('barBat').style.width = pctBat + '%';

      const statusBox = document.getElementById('statusBox');
      if (data.status === 'running') {
        statusBox.innerText = 'СТАТУС: РАБОТАЕТ';
        statusBox.className = 'status-box status-running';
      } else {
        statusBox.innerText = 'СТАТУС: ОЖИДАНИЕ';
        statusBox.className = 'status-box status-idle';
      }

      document.getElementById('stageInfo').innerText = 'Этап: ' + (data.stage_name || '—');
      document.getElementById('lastUpdate').innerText = 'Обновлено: ' + new Date().toLocaleTimeString();
      
      log('Данные обновлены локально (симуляция)', 'info');
    }

    // --- ЭМУЛЯЦИЯ РАБОТЫ СИСТЕМЫ ---
    function startSimulationLoop() {
      const data = getSimulatedData();
      updateUI(data);
      
      // Меняем данные каждые 2 секунды для наглядности
      setTimeout(startSimulationLoop, 2000);
    }

    // --- ФУНКЦИИ УПРАВЛЕНИЯ (Кнопки) ---
    function sendCommand(cmd) {
      log('Команда отправлена: ' + cmd, 'info');
      // Здесь в будущем будет реальный fetch() для ESP32
      // Сейчас просто логируем, чтобы интерфейс не ломался
    }

    function selectRecipe(name) {
      sendCommand('RECIPE_' + name);
      log('Выбран рецепт: ' + name, 'info');
    }

    function addRecipe() {
      const name = document.getElementById('newRecipeName').value.trim();
      const tCam = parseFloat(document.getElementById('targetCam').value);
      const tBat = parseFloat(document.getElementById('targetBat').value);
      
      if (!name || isNaN(tCam) || isNaN(tBat)) {
        log('Заполни все поля', 'error');
        return;
      }

      // В демо-режиме просто показываем успех, без записи на сервер
      log('Рецепт "' + name + '" добавлен в локальную память', 'info');
      
      // Очищаем поля
      document.getElementById('newRecipeName').value = '';
      document.getElementById('targetCam').value = '';
      document.getElementById('targetBat').value = '';
      
      // Перезагружаем список (в демо просто пишем в лог, что рецепт принят)
      loadRecipesDemo();
    }

    // --- ДЕМО-СПИСОК РЕЦЕПТОВ (без файла recipes.txt) ---
    const demoRecipes = [
      { name: 'Горячее копчение', target_cam: 80, target_bat: 65, active: true },
      { name: 'Холодное копчение', target_cam: 25, target_bat: 22, active: false },
      { name: 'Запекание', target_cam: 120, target_bat: 85, active: false }
    ];

    function loadRecipesDemo() {
      const list = document.getElementById('recipe-list');
      list.innerHTML = '';
      demoRecipes.forEach(r => {
        const div = document.createElement('div');
        div.className = 'recipe-item';
        div.innerHTML = `<span class="recipe-name ${r.active ? 'recipe-active' : ''}">${r.name}</span><span style="color:#64748b">${r.target_cam}°C / ${r.target_bat}°C</span>`;
        div.onclick = () => {
          selectRecipe(r.name);
          // Визуально подсвечиваем активный рецепт
          demoRecipes.forEach(rec => rec.active = false);
          r.active = true;
          loadRecipesDemo();
        };
        list.appendChild(div);
      });
    }

    // --- ЗАПУСК ---
    document.addEventListener('DOMContentLoaded', () => {
      loadRecipesDemo();
      startSimulationLoop(); // Запускаем имитацию данных
    });
  </script>
</body>
</html>
